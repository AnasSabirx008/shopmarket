spring.application.name=spring-boot-shopmarket

# Database: values come from environment variables, defaults = local XAMPP
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopmark-db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Security: tokens must be issued by this Keycloak realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/shopmarket}

spring.mvc.problemdetails.enabled=true